[project]
authors = [
  {name = "Nhan Nguyen"},
]
dependencies = [
  "alembic>=1.18.4",
  "fastapi[standard]>=0.133.0",
  "fuzzywuzzy>=0.18.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.13.1",
  "sqlmodel>=0.0.38",
]
description = "HarfangLab tech test"
name = "harfanglab-test"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "requests>=2.34.2",
  "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501"]
